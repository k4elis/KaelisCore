# Configuration des events

enabled: true

# Planificateur d'events
scheduler:
  # Intervalle de vérification (en secondes)
  check-interval: 60

# Events programmés automatiques
scheduled-events:
  drop_party_midi:
    type: drop_party
    enabled: true
    times:
      - "12:00"
    duration: 5  # minutes
  
  drop_party_soir:
    type: drop_party
    enabled: true
    times:
      - "18:00"
    duration: 5
  
  double_xp_weekend:
    type: double_xp
    enabled: true
    times:
      - "14:00"
      - "20:00"
    duration: 30
  
  double_money_daily:
    type: double_money
    enabled: true
    times:
      - "19:00"
    duration: 30

# Durées par défaut (en minutes)
default-durations:
  double_xp: 30
  double_money: 30
  drop_party: 5

# Configuration Drop Party
drop-party:
  # Items à drop (ajoutés aléatoirement)
  items:
    - "DIAMOND:1-3"
    - "GOLD_INGOT:5-10"
    - "IRON_INGOT:10-20"
    - "EMERALD:1-5"
    - "GOLDEN_APPLE:1-2"
    - "NETHERITE_INGOT:1"
    - "ENCHANTED_GOLDEN_APPLE:1"
