# Configuration des events

enabled: true

# Planificateur d'events
scheduler:
  # Intervalle de vérification (en secondes)
  check-interval: 300

# Events programmés
scheduled-events:
  # Format: "HH:mm" -> type
  # Example:
  # "12:00": "double_xp"
  # "18:00": "drop_party"

# Durées par défaut (en minutes)
default-durations:
  double_xp: 30
  double_money: 30
  drop_party: 5

# Configuration Drop Party
drop-party:
  # Items à drop (ajoutés aléatoirement)
  items:
    - "DIAMOND:1-3"
    - "GOLD_INGOT:5-10"
    - "IRON_INGOT:10-20"
    - "EMERALD:1-5"
    - "GOLDEN_APPLE:1-2"
