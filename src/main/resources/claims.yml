# Configuration des claims (protection de terrain)

enabled: true

# Outil pour créer des claims (style GriefPrevention)
# Clic droit avec cet outil pour définir les coins
claim-tool: GOLDEN_SHOVEL

# Limites
limits:
  # Nombre maximum de claims par joueur
  max-claims-per-player: 5
  # Taille maximum d'un claim (en blocs²)
  max-claim-size: 10000
  # Taille minimum d'un claim (en blocs²)
  min-claim-size: 100

# Blocks de claim gagnés par heure de jeu
claim-blocks-per-hour: 100

# Flags par défaut pour les nouveaux claims
default-flags:
  pvp: false
  mob-spawning: true
  explosions: false
  fire-spread: false

# Visualisation des claims
visualization:
  # Durée d'affichage (en secondes)
  duration: 30
  # Couleur pour les claims du joueur (format RGB)
  own-color: "0,255,0"
  # Couleur pour les claims des autres
  other-color: "255,255,0"
